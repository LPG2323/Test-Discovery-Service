apiVersion: apps/v1
kind: Deployment

metadata:
  name: discovery-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: discovery-service

  template:
    metadata:
      labels:
        app: discovery-service

    spec:
      containers:
        - name: discovery-service
          image: maitrelpg/ds:1
          ports:
            - containerPort: 8761